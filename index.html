function fillSelect(id, values){const el=document.getElementById(id);values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);})}
['player','instance','category'].forEach(k=>fillSelect(k,options[k]));
function getFilters(){return{player:document.getElementById('player').value,instance:document.getElementById('instance').value,category:document.getElementById('category').value,search:document.getElementById('search').value.trim().toLowerCase()}}
function buildSummary(filtered){const grouped=new Map();filtered.forEach(r=>{if(!grouped.has(r.Jogador)){const row={Jogador:r.Jogador,'Total peças':0};categories.forEach(c=>row[c]=0);grouped.set(r.Jogador,row);}const g=grouped.get(r.Jogador);g['Total peças']+=1;g[r.Categoria]=(g[r.Categoria]||0)+1;});return [...grouped.values()].sort((a,b)=>b['Total peças']-a['Total peças']||a.Jogador.localeCompare(b.Jogador));}
function renderSummary(rows){const head=['Jogador','Total peças',...categories];document.getElementById('summaryHead').innerHTML=head.map(h=>`<th>${h}</th>`).join('');document.getElementById('summaryBody').innerHTML=rows.map(r=>`<tr>${head.map(h=>`<td>${r[h]??0}</td>`).join('')}</tr>`).join('');}
function applyFilters(){const f=getFilters();const filtered=items.filter(r=>(!f.player||r.Jogador===f.player)&&(!f.instance||r.Raid===f.instance)&&(!f.category||r.Categoria===f.category)&&(!f.search||[r.Item,r.Boss,r.Categoria,r.Nota].join(' ').toLowerCase().includes(f.search)));const summaryRows=buildSummary(filtered);renderSummary(summaryRows);document.getElementById('itemsBody').innerHTML=filtered.map(r=>`<tr><td>${r.Jogador}</td><td>${r.Data} ${r.Hora}</td><td>${r.Boss||''}</td><td>${r.Item||''}</td><td>${r.Categoria||''}</td><td>${r.Resposta||''}</td><td>${r.Owner||''}</td><td>${r.Nota||''}</td></tr>`).join('');const uniquePlayers=new Set(filtered.map(r=>r.Jogador).filter(Boolean)).size;const uniqueItems=new Set(filtered.map(r=>r.ItemID).filter(Boolean)).size;document.getElementById('stats').innerHTML=`<div class="stat"><span class="muted">Registos filtrados</span><b>${filtered.length}</b></div><div class="stat"><span class="muted">Jogadores</span><b>${uniquePlayers}</b></div><div class="stat"><span class="muted">Items distintos</span><b>${uniqueItems}</b></div><div class="stat"><span class="muted">Top jogador</span><b>${summaryRows[0]?.Jogador||'—'}</b></div>`;}
