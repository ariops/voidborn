<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidborn Loot History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1f2430;--text:#eef2ff;--muted:#9aa4bf;--line:#2b3242;--accent:#9a5cff;--ok:#3ecf8e;--warn:#f0b429}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#09070d,#12101d);color:var(--text)}.wrap{max-width:1680px;margin:0 auto;padding:24px}.card{background:rgba(23,26,33,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.hero{display:grid;gap:16px;margin-bottom:20px}.hero-card{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:136px}.hero-copy{min-width:0}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.7rem,3vw,2.3rem)}p{color:var(--muted);margin-top:8px;line-height:1.55}.hero-logo{width:120px;height:120px;object-fit:contain;flex:none;border-radius:14px;filter:drop-shadow(0 6px 16px rgba(118,49,209,.32))}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.stat{padding:16px;background:var(--panel2);border-radius:14px;border:1px solid var(--line)}.stat b{display:block;font-size:28px;margin-top:6px}.layout{display:grid;grid-template-columns:320px 1fr;gap:16px}.filters{position:sticky;top:12px;height:max-content;padding:18px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.08em}select,input{width:100%;background:#0f141d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#0f141d;color:var(--text);border:1px solid var(--line)}.two{display:grid;gap:16px}.panel{overflow:auto;padding:18px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}th{position:sticky;top:0;background:var(--panel)}.muted{color:var(--muted)}.status{font-size:13px;color:var(--warn);min-height:20px;margin-top:8px}@media(max-width:980px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.wrap{padding:14px}.hero-card{min-height:112px}.hero-logo{width:88px;height:88px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="card hero-card"><div class="hero-copy"><h1>Voidborn Loot History</h1><p>Porque alguém tem de se lembrar de quem ficou com o trinket.</p><p class="status" id="status" aria-live="polite"></p></div><img class="hero-logo" src="voidborn-logo.jpg" alt="Emblema da guild Voidborn" width="120" height="120"></div>
<div class="stats" id="stats"></div>
</section>
<section class="layout">
<aside class="card filters"><h3>Filtros</h3><label>Jogador</label><select id="player"><option value="">Todos</option></select><label>Raid</label><select id="instance"><option value="">Todas</option></select><label>Categoria</label><select id="category"><option value="">Todas</option></select><label>Pesquisar item</label><input id="search" placeholder="ex: trinket, boots, venom..."><div class="btns"><button class="primary" id="apply">Aplicar</button><button class="ghost" id="reset">Limpar</button></div></aside>
<main class="two"><div class="card panel"><h3 style="margin-bottom:12px">Resumo por jogador</h3><table><thead><tr id="summaryHead"></tr></thead><tbody id="summaryBody"></tbody></table></div><div class="card panel"><h3 style="margin-bottom:12px">Loot detalhado</h3><table><thead><tr><th>Jogador</th><th>Data</th><th>Boss</th><th>Item</th><th>Categoria</th><th>Resposta</th><th>Owner</th><th>Nota</th></tr></thead><tbody id="itemsBody"></tbody></table></div></main>
</section></div>
<script>
const categories=['Token','Head','Shoulder','Back','Chest','Waist','Legs','Feet','Wrist','Hands','Neck','Ring','Trinket','Off Hand','Shield','Weapons'];
const ignoreResponses=new Set(['Disenchant','Personal Loot - Non tradeable']);const ignoreSubtypes=new Set(['Companion Pets','Cosmetic']);const weaponSubtypes=new Set(['Daggers','Fist Weapons','Two-Handed Swords','One-Handed Swords','Bows','Guns','Crossbows','One-Handed Axes','Two-Handed Axes','One-Handed Maces','Two-Handed Maces','Polearms','Staves','Staff','Wands','Wand']);let items=[];
function normalizeCategory(equip,subtype){equip=(equip||'').trim();subtype=(subtype||'').trim();if(subtype==='Armor Token')return'Token';if(weaponSubtypes.has(subtype))return'Weapons';if(subtype==='Shields'||equip==='Shield')return'Shield';return{'Head':'Head','Shoulder':'Shoulder','Back':'Back','Chest':'Chest','Waist':'Waist','Legs':'Legs','Feet':'Feet','Wrist':'Wrist','Hands':'Hands','Neck':'Neck','Finger':'Ring','Trinket':'Trinket','Off Hand':'Off Hand','Held In Off-hand':'Off Hand'}[equip]||'Other'}
function normalizePlayer(player){return(player||'').replace(/-.+$/,'').trim()}function fillSelect(id,values){const el=document.getElementById(id);el.innerHTML=`<option value="">${id==='player'?'Todos':'Todas'}</option>`;values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)})}function filters(){return{player:player.value,instance:instance.value,category:category.value,search:search.value.trim().toLowerCase()}}
function summary(filtered){const map=new Map();filtered.forEach(r=>{if(!map.has(r.Jogador)){const x={Jogador:r.Jogador,'Total peças':0,'Offspec/Greed':0};categories.forEach(c=>x[c]=0);map.set(r.Jogador,x)}const x=map.get(r.Jogador);if(r.Resposta==='Offspec/Greed'){x['Offspec/Greed']++;return}if(r.Resposta==='Bonus Loot')return;x['Total peças']++;x[r.Categoria]++});return[...map.values()].sort((a,b)=>b['Total peças']-a['Total peças']||b['Offspec/Greed']-a['Offspec/Greed']||a.Jogador.localeCompare(b.Jogador))}
function render(){const f=filters();const filtered=items.filter(r=>(!f.player||r.Jogador===f.player)&&(!f.instance||r.Raid===f.instance)&&(!f.category||r.Categoria===f.category)&&(!f.search||[r.Item,r.Boss,r.Categoria,r.Nota].join(' ').toLowerCase().includes(f.search))).sort((a,b)=>`${b.Data||''}${b.Hora||''}`.localeCompare(`${a.Data||''}${a.Hora||''}`));const rows=summary(filtered),heads=['Jogador','Total peças','Offspec/Greed',...categories];summaryHead.innerHTML=heads.map(h=>`<th>${h}</th>`).join('');summaryBody.innerHTML=rows.map(r=>`<tr>${heads.map(h=>`<td>${r[h]??0}</td>`).join('')}</tr>`).join('');itemsBody.innerHTML=filtered.map(r=>`<tr><td>${r.Jogador}</td><td>${r.Data} ${r.Hora}</td><td>${r.Boss||''}</td><td>${r.Item||''}</td><td>${r.Categoria||''}</td><td>${r.Resposta||''}</td><td>${r.Owner||''}</td><td>${r.Nota||''}</td></tr>`).join('');stats.innerHTML=`<div class="stat"><span class="muted">Registos filtrados</span><b>${filtered.length}</b></div><div class="stat"><span class="muted">Jogadores</span><b>${new Set(filtered.map(r=>r.Jogador).filter(Boolean)).size}</b></div><div class="stat"><span class="muted">Items main</span><b>${filtered.filter(r=>r.Resposta!=='Offspec/Greed'&&r.Resposta!=='Bonus Loot').length}</b></div><div class="stat"><span class="muted">Offspec/Greed</span><b>${filtered.filter(r=>r.Resposta==='Offspec/Greed').length}</b></div><div class="stat"><span class="muted">Maior Mamão</span><b>${rows[0]?.Jogador||'—'}</b></div>`}
function setup(rows){items=rows.filter(r=>!ignoreResponses.has((r.response||'').trim())&&!ignoreSubtypes.has((r.subType||'').trim())).map(r=>({Jogador:normalizePlayer(r.player),Data:(r.date||'').trim(),Hora:(r.time||'').trim(),Raid:(r.instance||'').trim(),Boss:(r.boss||'').trim(),Item:(r.item||'').replace(/^\[|\]$/g,'').trim(),ItemID:(r.itemID||'').trim(),Categoria:normalizeCategory(r.equipLoc,r.subType),Resposta:(r.response||'').trim(),Owner:(r.owner||'').trim(),Nota:(r.note||'').trim()})).filter(r=>categories.includes(r.Categoria));fillSelect('player',[...new Set(items.map(r=>r.Jogador).filter(Boolean))].sort((a,b)=>a.localeCompare(b)));fillSelect('instance',[...new Set(items.map(r=>r.Raid).filter(Boolean))].sort((a,b)=>a.localeCompare(b)));fillSelect('category',categories);render();status.textContent=''}
Papa.parse('voidbornloot.csv',{download:true,header:true,skipEmptyLines:true,complete:r=>setup(r.data||[]),error:()=>status.textContent='Não foi possível carregar os dados de loot.'});apply.addEventListener('click',render);reset.addEventListener('click',()=>{player.value='';instance.value='';category.value='';search.value='';render()});
</script></body></html>
